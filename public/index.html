<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kaleab Bingo</title>
  <script src="https://telegram.org"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 12px; padding-bottom: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #334155; }
    .brand { font-size: 18px; font-weight: 800; color: #facc15; }
    .wallet-bar { display: flex; justify-content: space-between; align-items: center; background: #064e3b; border: 1px solid #10b981; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; }
    .wallet-bal { font-size: 16px; font-weight: 900; color: #34d399; }
    .prize-tag { font-size: 14px; font-weight: 800; color: #fde047; }
    .status-pill { background: #0284c7; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    .status-pill.live { background: #16a34a; }
    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 999; display: none; text-align: center; width: 90%; }
    .section-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; display: flex; justify-content: space-between; }
    .cartela-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-bottom: 16px; }
    .cartela-btn { aspect-ratio: 1; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cartela-btn.taken { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .cartela-btn.mine { background: #facc15; color: #0f172a; }
    .caller-box { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 12px; margin-bottom: 14px; display: none; }
    .caller-top { display: flex; align-items: center; justify-content: space-between; }
    .current-ball { width: 68px; height: 68px; border-radius: 50%; background: #eab308; color: #0f172a; font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; }
    .recent-wrap { flex: 1; margin-left: 12px; }
    .recent-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .recent-balls { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini-ball { background: #334155; color: #f8fafc; padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .board-container { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 12px; display: none; }
    .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .board-id { font-size: 15px; font-weight: 800; color: #facc15; }
    .bingo-letters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 6px; }
    .letter-cell { text-align: center; font-weight: 900; font-size: 18px; padding: 6px 0; border-radius: 8px; color: #0f172a; }
    .l-b { background: #38bdf8; }
    .l-i { background: #f472b6; }
    .l-n { background: #facc15; }
    .l-g { background: #4ade80; }
    .l-o { background: #fb923c; }
    .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
    .num-cell { aspect-ratio: 1; background: #0f172a; border: 2px solid #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #f8fafc; cursor: pointer; }
    .num-cell.marked { background: #16a34a; border-color: #4ade80; color: #ffffff; }
    .num-cell.free { background: #eab308; border-color: #fef08a; color: #0f172a; font-size: 13px; }
    .claim-btn { width: 100%; padding: 15px; background: #facc15; color: #0f172a; font-size: 19px; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; }
    .winner-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.92); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .winner-card { background: #1e293b; border: 2px solid #facc15; border-radius: 16px; padding: 24px; text-align: center; width: 100%; max-width: 340px; }
    .winner-title { font-size: 26px; font-weight: 900; color: #facc15; margin-bottom: 10px; }
    .winner-detail { font-size: 16px; color: #f8fafc; margin-bottom: 6px; }
    .winner-prize { font-size: 22px; font-weight: 900; color: #34d399; margin: 10px 0; }
    .winner-sub { font-size: 13px; color: #94a3b8; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="header">
    <div class="brand">ድል BINGO</div>
    <div id="statusPill" class="status-pill">Lobby: 30s</div>
  </div>
    <div class="wallet-bar">
    <div>
      <div class="wallet-bal">Wallet: <span id="walletBal">--</span> ETB</div>
      <div class="prize-tag">Prize: <span id="prizePool">0</span> ETB</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <button onclick="openBotCashier('deposit')" style="background: #10b981; color: #052e16; border: none; padding: 8px 10px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer;">+ Deposit</button>
      <button onclick="openBotCashier('withdraw')" style="background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;">Withdraw</button>
    </div>
  </div>

  <div id="callerBox" class="caller-box">
    <div class="caller-top">
      <div id="currentBall" class="current-ball">--</div>
      <div class="recent-wrap">
        <div class="recent-label">Recent Balls (<span id="ballCount">0</span>/75)</div>
        <div id="recentBalls" class="recent-balls"></div>
      </div>
    </div>
  </div>
  <div id="lobbySection">
    <div class="section-title">
      <span>Pick Cartela (Stake: <span id="entryFeeLabel">10</span> ETB)</span>
      <span id="takenCount">0 Taken</span>
    </div>
    <div id="cartelaGrid" class="cartela-grid"></div>
  </div>
  <div id="boardContainer" class="board-container">
    <div class="board-header">
      <div id="boardTitle" class="board-id">Cartela #--</div>
      <div style="font-size: 12px; color: #94a3b8;">Tap numbers to mark</div>
    </div>
    <div class="bingo-letters">
      <div class="letter-cell l-b">B</div>
      <div class="letter-cell l-i">I</div>
      <div class="letter-cell l-n">N</div>
      <div class="letter-cell l-g">G</div>
      <div class="letter-cell l-o">O</div>
    </div>
    <div id="bingoGrid" class="bingo-grid"></div>
    <button id="claimBtn" class="claim-btn">BINGO!</button>
  </div>
  <div id="winnerModal" class="winner-modal">
    <div class="winner-card">
      <div class="winner-title">BINGO! 🎉</div>
      <div id="winnerName" class="winner-detail">Winner: Player</div>
      <div id="winnerCartela" class="winner-detail">Cartela #0</div>
      <div id="winnerPattern" class="winner-detail" style="color: #4ade80;">Pattern: Row 1</div>
      <div id="winnerPrize" class="winner-prize">+0 ETB</div>
      <div class="winner-sub">Next round starts in a few seconds...</div>
    </div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const socket = io();
    let myCartelaId = null;
    let currentGameState = 'LOBBY';
    let lockedMap = {};
    let markedNumbers = new Array();

    const statusPill = document.getElementById('statusPill');
    const walletBal = document.getElementById('walletBal');
    const prizePool = document.getElementById('prizePool');
    const entryFeeLabel = document.getElementById('entryFeeLabel');
    const lobbySection = document.getElementById('lobbySection');
    const cartelaGrid = document.getElementById('cartelaGrid');
    const takenCount = document.getElementById('takenCount');
    const callerBox = document.getElementById('callerBox');
    const currentBall = document.getElementById('currentBall');
    const recentBalls = document.getElementById('recentBalls');
    const ballCount = document.getElementById('ballCount');
    const boardContainer = document.getElementById('boardContainer');
    const boardTitle = document.getElementById('boardTitle');
    const bingoGrid = document.getElementById('bingoGrid');
    const claimBtn = document.getElementById('claimBtn');
    const winnerModal = document.getElementById('winnerModal');

            socket.on('connect', function () {
      setTimeout(function () {
        const webApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (webApp) {
          webApp.ready();
          webApp.expand();
        }
        const initData = webApp ? webApp.initData : '';
        const tgUser = webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user ? webApp.initDataUnsafe.user : null;

        let localId = localStorage.getItem('kaleab_guest_id');
        if (!localId) {
          localId = 'guest_' + Math.floor(Math.random() * 1000000000);
          localStorage.setItem('kaleab_guest_id', localId);
        }

        socket.emit('authUser', {
          initData: initData,
          fallbackId: tgUser ? String(tgUser.id) : localId,
          fallbackName: tgUser ? tgUser.first_name : 'Player'
        });
      }, 400);
    });



    socket.on('walletUpdate', function (data) {
      if (data.balance !== undefined) {
        walletBal.textContent = Number(data.balance).toFixed(2);
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(function () { toast.style.display = 'none'; }, 3000);
    }

    function formatBall(num) {
      if (num <= 15) return 'B-' + num;
      if (num <= 30) return 'I-' + num;
      if (num <= 45) return 'N-' + num;
      if (num <= 60) return 'G-' + num;
      return 'O-' + num;
    }

    function generateCartelaGrid(cartelaId) {
      let seed = cartelaId * 9301 + 49297;
      function nextRandom() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      }
      const ranges = new Array(
        { min: 1, max: 15 },
        { min: 16, max: 30 },
        { min: 31, max: 45 },
        { min: 46, max: 60 },
        { min: 61, max: 75 }
      );
      const columns = new Array();
      for (let c = 0; c < 5; c++) {
        const range = ranges.at(c);
        const pool = new Array();
        for (let n = range.min; n <= range.max; n++) { pool.push(n); }
        const colNumbers = new Array();
        for (let r = 0; r < 5; r++) {
          const idx = Math.floor(nextRandom() * pool.length);
          colNumbers.push(pool.at(idx));
          pool.splice(idx, 1);
        }
        columns.push(colNumbers);
      }
      const rows = new Array();
      for (let r = 0; r < 5; r++) {
        const row = new Array();
        for (let c = 0; c < 5; c++) {
          if (r === 2 && c === 2) { row.push(0); }
          else { row.push(columns.at(c).at(r)); }
        }
        rows.push(row);
      }
      return rows;
    }

    function renderLobbyGrid() {
      cartelaGrid.innerHTML = '';
      takenCount.textContent = Object.keys(lockedMap).length + ' Taken';
      for (let i = 1; i <= 100; i++) {
        const btn = document.createElement('button');
        btn.className = 'cartela-btn';
        btn.textContent = i;
        if (myCartelaId === i) { btn.classList.add('mine'); }
        else if (lockedMap[i]) { btn.classList.add('taken'); }
        btn.addEventListener('click', function () {
          if (currentGameState !== 'LOBBY') { showToast('Wait for next round.'); return; }
          if (lockedMap[i]) { showToast('Cartela #' + i + ' taken!'); return; }
          socket.emit('selectCartela', { cartelaId: i });
        });
        cartelaGrid.appendChild(btn);
      }
    }

    function renderBoard(cartelaId) {
      boardTitle.textContent = 'Cartela #' + cartelaId;
      bingoGrid.innerHTML = '';
      const grid = generateCartelaGrid(cartelaId);
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const val = grid.at(r).at(c);
          const cell = document.createElement('div');
          cell.className = 'num-cell';
          if (val === 0) {
            cell.textContent = 'FREE';
            cell.classList.add('free');
          } else {
            cell.textContent = val;
            if (markedNumbers.includes(val)) { cell.classList.add('marked'); }
            cell.addEventListener('click', function () {
              if (markedNumbers.includes(val)) {
                markedNumbers.splice(markedNumbers.indexOf(val), 1);
                cell.classList.remove('marked');
              } else {
                markedNumbers.push(val);
                cell.classList.add('marked');
              }
            });
          }
          bingoGrid.appendChild(cell);
        }
      }
    }

    function updateBallsUI(calledList) {
      ballCount.textContent = calledList.length;
      if (calledList.length === 0) { currentBall.textContent = '--'; recentBalls.innerHTML = ''; return; }
      currentBall.textContent = formatBall(calledList.at(calledList.length - 1));
      recentBalls.innerHTML = '';
      const startIdx = Math.max(0, calledList.length - 6);
      for (let i = calledList.length - 2; i >= startIdx; i--) {
        const b = document.createElement('div');
        b.className = 'mini-ball';
        b.textContent = formatBall(calledList.at(i));
        recentBalls.appendChild(b);
      }
    }

    claimBtn.addEventListener('click', function () {
      if (!myCartelaId) { showToast('No active Cartela!'); return; }
      if (currentGameState !== 'PLAYING') { showToast('Game not active.'); return; }
      socket.emit('claimBingo', { cartelaId: myCartelaId });
    });

    socket.on('timerTick', function (s) {
      if (currentGameState === 'LOBBY') { statusPill.textContent = 'Lobby: ' + s + 's'; statusPill.classList.remove('live'); }
    });

    socket.on('cartelaConfirmed', function (data) {
      myCartelaId = data.cartelaId;
      markedNumbers = new Array();
      boardContainer.style.display = 'block';
      renderBoard(myCartelaId);
      renderLobbyGrid();
    });

    socket.on('stateUpdate', function (state) {
      currentGameState = state.gameState;
      lockedMap = state.lockedCartelas || {};
      if (state.prizePool !== undefined) { prizePool.textContent = state.prizePool; }
      if (state.entryFee !== undefined) { entryFeeLabel.textContent = state.entryFee; }

      if (currentGameState === 'LOBBY') {
        winnerModal.style.display = 'none';
        callerBox.style.display = 'none';
        lobbySection.style.display = 'block';
        statusPill.textContent = 'Lobby: ' + state.lobbyTimer + 's';
        statusPill.classList.remove('live');
        if (myCartelaId && !lockedMap[myCartelaId]) {
          myCartelaId = null;
          markedNumbers = new Array();
          boardContainer.style.display = 'none';
        }
        renderLobbyGrid();
      } else if (currentGameState === 'PLAYING') {
        winnerModal.style.display = 'none';
        lobbySection.style.display = 'none';
        callerBox.style.display = 'block';
        statusPill.textContent = 'LIVE ROUND';
        statusPill.classList.add('live');
        updateBallsUI(state.calledNumbers || new Array());
        if (myCartelaId) { boardContainer.style.display = 'block'; }
      } else if (currentGameState === 'ENDED' && state.winnerInfo) {
        showWinnerModal(state.winnerInfo);
      }
    });

    socket.on('ballCalled', function (data) { updateBallsUI(data.calledNumbers || new Array()); });
    socket.on('gameWon', function (info) { currentGameState = 'ENDED'; showWinnerModal(info); });

    function showWinnerModal(info) {
      document.getElementById('winnerName').textContent = 'Winner: ' + info.playerName;
      document.getElementById('winnerCartela').textContent = 'Cartela #' + info.cartelaId;
      document.getElementById('winnerPattern').textContent = 'Pattern: ' + info.pattern;
      document.getElementById('winnerPrize').textContent = '+' + (info.prize || 0) + ' ETB';
      winnerModal.style.display = 'flex';
    }

    socket.on('errorMsg', function (msg) { showToast(msg); });
        function openBotCashier(action) {
      const webApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (webApp) {
        webApp.close();
      } else {
        showToast('Open @kaleab_bingo_bot chat and tap ' + action);
      }
    }

  </script>
</body>
</html>
